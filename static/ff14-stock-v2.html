<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 材料台账 v2</title>
<link rel="icon" type="image/svg+xml" href="/logo-16.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<style>
/* ━━━━━ 配置说明 ━━━━━
   默认走同源相对路径（页面由后端伺服，端口/手机访问自动适应）
   如需连别的后端：右上角 ⚙ 输入地址，或改 JS 里的 CFG.baseUrl
━━━━━━━━━━━━━━━━━━ */

/* ━━━━━ 设计令牌 ━━━━━ */
:root {
  --bg: #f0f2f5; --panel: #ffffff; --panel-2: #eef1f4; --text: #1a202c;
  --muted: #5f6a76; --line: #e3e7ec; --accent: #2a7180; --accent-soft: #e9f3f5;
  --warn: #b45309; --warn-bg: #fdf5e9; --danger: #b91c1c; --danger-soft: #fef2f2;
  --ok: #15803d; --hq: #b8882a; --hq-soft: #fdf8ed;
  --nav-bg: #1a2535; --nav-text: #c8d4e0; --nav-text-active: #ffffff;
  --radius: 8px; --shadow: 0 1px 3px rgba(15,23,42,.08);
  --shadow-lg: 0 8px 24px rgba(15,23,42,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #181d23; --panel-2: #20262e; --text: #e7ebf0;
    --muted: #98a3b0; --line: #2a323b; --accent: #63b6c6; --accent-soft: #1c3138;
    --warn: #eab069; --warn-bg: #2b2318; --danger: #f2777a; --danger-soft: #2b1a1a;
    --ok: #5cc98a; --hq: #d4a84b; --hq-soft: #2b2318;
    --nav-bg: #0d1117; --nav-text: #8b97a6; --nav-text-active: #e7ebf0;
    --shadow: 0 1px 3px rgba(0,0,0,.3); --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
  }
}

/* ━━━━━ 重置 ━━━━━ */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden;
}
button, input, select { font-family: inherit; font-size: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ━━━━━ 控件 ━━━━━ */
input[type=text], input[type=number], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; height: 36px; outline: none;
}
input[type=text]:focus, select:focus { border-color: var(--accent); }
button { cursor: pointer; border: none; transition: filter .15s; }
button:disabled { opacity: .45; cursor: default; }
.btn-primary {
  background: var(--accent); color: #fff; border-radius: 6px;
  padding: 0 18px; height: 36px; font-size: 13px; font-weight: 500;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-ghost {
  background: transparent; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 0 12px; height: 32px; font-size: 13px;
}
.btn-ghost:hover { color: var(--text); border-color: color-mix(in srgb, var(--text) 25%, transparent); }
.btn-mini {
  background: transparent; color: var(--muted); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 8px; font-size: 12px; white-space: nowrap;
}
.btn-mini:hover { color: var(--text); }
.btn-mini.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-mini.danger:hover { background: var(--danger-soft); }
.btn-mini.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.topbar-actions .btn-ghost.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ━━━━━ 顶部导航 ━━━━━ */
.topbar {
  background: var(--nav-bg); color: var(--nav-text); height: 52px;
  display: flex; align-items: center; gap: 12px; padding: 0 16px; flex-shrink: 0; z-index: 100;
}
.topbar-brand { display: flex; align-items: center; gap: 8px; color: var(--nav-text-active);
  font-size: 15px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.brand-logo { width: 24px; height: 24px; border-radius: 5px; flex-shrink: 0; }
.topbar-version { font-size: 11px; color: var(--nav-text); border: 1px solid #3a4b60;
  border-radius: 4px; padding: 1px 6px; }
.topbar-stats { display: flex; gap: 20px; flex: 1; justify-content: center; font-size: 12px; }
.stat-item { display: flex; align-items: center; gap: 5px; }
.stat-label { color: var(--nav-text); }
.stat-value { color: var(--nav-text-active); font-weight: 500; font-variant-numeric: tabular-nums; }
.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }
.topbar-actions .btn-ghost { color: var(--nav-text); border-color: #3a4b60; height: 30px; }
.topbar-actions .btn-ghost:hover { color: var(--nav-text-active); }
/* 快捷键面板（与算料页共用同一套交互） */
.hk-open { background: transparent; border: 1px solid #3a4b60; color: var(--nav-text); border-radius: 6px; height: 30px; width: 34px; font-size: 14px; }
.hk-open:hover { color: var(--nav-text-active); }
.hk-panel { position: fixed; z-index: 80; width: 320px; max-width: calc(100vw - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 14px; }
.hk-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.hk-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hk-name { flex: 1; font-size: 13px; }
.hk-combo { min-width: 90px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text); font-size: 12px; }
.hk-combo.recording { border-color: var(--danger); color: var(--danger); }
.hk-record { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--accent); font-size: 12px; }
.hk-tip { font-size: 11px; color: var(--muted); margin: 8px 0; }
.hk-actions button { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 12px; }

/* ━━━━━ 筛选区 ━━━━━ */
.filter-bar {
  background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; flex-shrink: 0;
}
.search-row { display: flex; gap: 8px; align-items: center; }
.search-wrap { position: relative; flex: 1; }
.search-wrap input { width: 100%; height: 38px; padding: 0 36px 0 12px; }
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); font-size: 16px; padding: 2px;
}
.search-clear:hover { color: var(--text); }
.filter-expanded { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.filter-expanded select { height: 32px; font-size: 13px; flex: 1; min-width: 100px; max-width: 200px; }
.active-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft);
  color: var(--accent); border-radius: 20px; padding: 2px 10px; font-size: 12px;
}
.filter-chip button { background: none; border: none; color: var(--accent); padding: 0 0 0 2px;
  font-size: 14px; line-height: 1; }
.result-bar { display: flex; align-items: center; justify-content: space-between;
  margin-top: 6px; font-size: 12px; color: var(--muted); }

/* ━━━━━ 主布局 ━━━━━ */
.main-layout { flex: 1; display: flex; min-height: 0; overflow: hidden; }
.list-pane { flex: 1; overflow-y: auto; padding: 12px 16px; min-width: 0; }
.detail-pane {
  width: 320px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; display: flex; flex-direction: column;
}

/* ━━━━━ 材料列表 ━━━━━ */
.item-list { display: flex; flex-direction: column; gap: 2px; }
.item-card {
  background: var(--panel); border-radius: 6px; border: 1px solid transparent;
  transition: border-color .15s; overflow: hidden;
}
.item-card:hover { border-color: var(--line); }
.item-card.selected { border-color: var(--accent); }
.item-card.warn-stack { border-left: 3px solid var(--warn); }
.item-main {
  display: grid; grid-template-columns: 36px 1fr auto auto 28px; align-items: center;
  gap: 10px; padding: 8px 12px; cursor: pointer; user-select: none; min-height: 52px;
}
.item-main:hover { background: var(--panel-2); }
.item-icon-wrap {
  width: 36px; height: 36px; border-radius: 4px; overflow: hidden; flex-shrink: 0;
  background: var(--panel-2); position: relative;
}
.item-icon-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.item-icon-placeholder {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 18px; background: linear-gradient(135deg, #2a7180 0%, #1a4a56 100%);
  color: rgba(255,255,255,.6);
}
.item-info { min-width: 0; }
.item-name-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.item-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.badge-hq { background: var(--hq); color: #fff; border-radius: 3px; font-size: 10px;
  font-weight: 700; padding: 1px 4px; flex-shrink: 0; }
.badge-nq { border: 1px solid var(--muted); color: var(--muted); border-radius: 3px;
  font-size: 10px; padding: 0px 3px; flex-shrink: 0; }
.item-alias { font-size: 11px; color: var(--muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.cost-note { font-size: 11px; color: var(--muted); cursor: pointer; display: inline-block; margin-top: 2px; }
.cost-note:hover { color: var(--accent); }
.cost-note.empty { color: var(--accent); }
.cost-note b { color: var(--text); font-weight: 600; }
.cost-edit { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.inline-cost { width: 72px; height: 24px; padding: 2px 6px; font-size: 12px; border: 1px solid var(--accent); border-radius: 4px; background: var(--panel); color: var(--text); }
.kind-tag { font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; }
.item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  font-size: 12px; color: var(--muted); white-space: nowrap; }
.stale-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.item-qty { font-size: 18px; font-weight: 600; text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums; min-width: 60px; }
.item-qty.stale { color: var(--warn); }
.expand-btn {
  background: none; border: none; color: var(--muted); padding: 4px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center; transition: transform .2s;
}
.expand-btn:hover { color: var(--text); background: var(--panel-2); }
.item-card.expanded .expand-btn { transform: rotate(90deg); }

/* 持有者列表 */
.holder-list { border-top: 1px solid var(--line); background: var(--panel-2); }
.holder-row {
  display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 8px;
  padding: 7px 12px 7px 58px; border-bottom: 1px solid var(--line);
}
.holder-row:last-child { border-bottom: none; }
.holder-info { min-width: 0; }
.holder-char { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.holder-loc { font-size: 11px; color: var(--muted); }
.holder-qty-cell { font-size: 14px; font-weight: 500; text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums; min-width: 50px; }
.holder-age { font-size: 11px; color: var(--muted); white-space: nowrap; }
.holder-age.stale { color: var(--warn); }
.holder-ops { display: flex; gap: 4px; }
.holder-hq-badge { background: var(--hq); color: #fff; border-radius: 3px; font-size: 10px;
  font-weight: 700; padding: 1px 4px; }

/* ━━━━━ 右侧详情面板 ━━━━━ */
.detail-empty { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--muted); text-align: center; padding: 32px; gap: 12px; }
.detail-content { flex: 1; overflow-y: auto; }
.detail-head { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.detail-icon-wrap { width: 48px; height: 48px; border-radius: 6px; overflow: hidden;
  flex-shrink: 0; background: var(--panel-2); position: relative; }
.detail-icon-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.detail-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.detail-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.detail-total { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.detail-section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.detail-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); margin-bottom: 8px; }
.detail-holder-row { padding: 8px 0; border-bottom: 1px solid var(--line); }
.detail-holder-row:last-child { border-bottom: none; }
.dh-top { display: flex; justify-content: space-between; align-items: center; }
.dh-char { font-size: 13px; font-weight: 500; }
.dh-qty { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dh-loc-age { display: flex; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.dh-age.stale { color: var(--warn); }
.dh-ops { display: flex; gap: 6px; margin-top: 8px; }
.detail-actions { padding: 12px 16px; display: flex; gap: 8px; }
.detail-actions .btn-primary { flex: 1; }
.cost-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
.cost-row .label { color: var(--muted); }
.cost-row .value { font-variant-numeric: tabular-nums; font-weight: 500; }

/* ━━━━━ 状态页 ━━━━━ */
.state-loading, .state-empty, .state-error {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 24px; text-align: center; color: var(--muted); gap: 12px;
}
.state-error { color: var(--danger); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 32px; height: 32px; border: 3px solid var(--line);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
.skeleton { background: linear-gradient(90deg, var(--panel-2) 25%, var(--line) 50%, var(--panel-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
.skeleton-row { height: 52px; background: var(--panel); border-radius: 6px; margin-bottom: 2px;
  padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.skeleton-icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: 4px; }
.skeleton-text { flex: 1; height: 14px; max-width: 180px; }
.skeleton-qty { width: 60px; height: 20px; }

/* ━━━━━ Toast ━━━━━ */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--nav-bg); color: var(--nav-text-active); padding: 10px 20px;
  border-radius: var(--radius); font-size: 13px; box-shadow: var(--shadow-lg);
  pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 999;
  white-space: nowrap; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; }
.toast.warn { background: var(--warn); color: #fff; }

/* ━━━━━ 移动端抽屉 ━━━━━ */
.drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; }
.drawer {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
  border-radius: 12px 12px 0 0; max-height: 85vh; overflow-y: auto; z-index: 201;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32,0,.67,0);
  padding-bottom: env(safe-area-inset-bottom);
}
.drawer.open { transform: translateY(0); }
.drawer-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 10px auto 6px; }
.drawer-body { padding: 0 0 16px; }

/* ━━━━━ 配置弹窗 ━━━━━ */
.config-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 500;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.config-box {
  background: var(--panel); border-radius: var(--radius); padding: 24px;
  width: 100%; max-width: 420px; box-shadow: var(--shadow-lg);
}
.config-box h2 { margin: 0 0 8px; font-size: 16px; }
.config-box p { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
.config-box input { width: 100%; margin-bottom: 12px; }
.config-actions { display: flex; gap: 8px; }
.config-actions .btn-primary { flex: 1; }

/* ━━━━━ 安全线弹窗 ━━━━━ */
.safety-modal {
  background: var(--panel); border-radius: var(--radius); padding: 0;
  width: 100%; max-width: 520px; max-height: 80vh; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
}
.safety-header {
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.safety-header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.safety-stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
.safety-close { background: none; border: none; color: var(--muted); font-size: 20px; padding: 4px; cursor: pointer; }
.safety-close:hover { color: var(--text); }
.safety-body { flex: 1; overflow-y: auto; padding: 12px; }
.safety-empty {
  text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px;
}
.safety-item {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center;
}
.safety-icon-wrap { width: 36px; height: 36px; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: var(--panel-2); }
.safety-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
.safety-info { flex: 1; min-width: 0; }
.safety-name { font-weight: 500; font-size: 13px; }
.safety-nums { display: flex; gap: 12px; font-size: 12px; margin-top: 2px; }
.safety-nums span { color: var(--muted); }
.safety-nums .current { font-weight: 500; }
.safety-status {
  width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.safety-status.ok { background: var(--ok); color: #fff; }
.safety-status.low { background: var(--warn); color: #fff; }
.safety-status.empty { background: var(--danger); color: #fff; }
.safety-del { color: var(--danger); font-size: 12px; padding: 4px 8px; }

.truncated-hint { text-align: center; padding: 10px; font-size: 12px; color: var(--muted); }
.truncated-hint a { color: var(--accent); cursor: pointer; text-decoration: underline; }

/* ━━━━━ 写操作模态 / 表单 ━━━━━ */
.wmodal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 600; display: flex; align-items: center; justify-content: center; padding: 16px; }
.wmodal { background: var(--panel); border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.wmodal.wide { max-width: 560px; }
.wmodal-hd { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.wmodal-hd b { font-size: 15px; }
.wmodal-close { background: none; border: none; color: var(--muted); font-size: 20px; padding: 2px 6px; }
.wmodal-close:hover { color: var(--text); }
.wmodal-body { padding: 16px 18px; }
.wform { display: flex; flex-direction: column; gap: 12px; }
.wfield { display: flex; flex-direction: column; gap: 4px; }
.wfield > label { font-size: 12px; color: var(--muted); }
.wfield input[type=text], .wfield input[type=number], .wfield select { width: 100%; }
.wfield .sub { font-size: 11px; color: var(--muted); }
.wrow { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.wrow > .wfield { flex: 1; min-width: 0; }
.qty-mode { display: inline-flex; align-self: flex-start; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.qty-mode button { background: var(--panel); color: var(--muted); border: 0; padding: 6px 14px; font-size: 12px; }

<script>
// ━━━━━ 配置（改这里） ━━━━━
// 空 = 同源相对路径：页面由后端伺服，自动适应端口漂移和手机访问
const CFG = { baseUrl: '' };

// ━━━━━ 状态 ━━━━━
const S = {
  csrfToken: '', version: '', stale_days: 7, locations: [], characters: [],
  character_count: 0, stock_rows: 0, total_qty: 0, pending_rows: 0,
  q: '', account: '', character: '', location: '', hq: '', limit: 40, filterOpen: false,
  phase: 'idle', items: [], truncated: false, total_items: 0, hint: '', selectedItemId: null,
};

// ━━━━━ 工具 ━━━━━
const $ = id => document.getElementById(id);
const fmtNum = n => n == null ? '—' : Number(n).toLocaleString('zh-CN');
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ━━━━━ API ━━━━━
async function api(path) {
  const res = await fetch(CFG.baseUrl + path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ━━━━━ 写请求 helper（CSRF 403 重试一次；网络异常不重试防重复入账） ━━━━━
async function refreshCsrfToken() { try { const s = await api('/api/state'); S.csrfToken = s.csrf_token || ''; } catch (e) {} }
async function postJSON(url, body, retried) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.csrfToken) headers['X-CSRF-Token'] = S.csrfToken;
  let res;
  try { res = await fetch(CFG.baseUrl + url, { method: 'POST', headers, body: JSON.stringify(body || {}), cache: 'no-store' }); }
  catch (e) { return { ok: false, offline: true, error: '无法连接服务：若刚才提交过，请刷新页面核对是否已保存' }; }
  if (res.status === 403 && !retried) { await refreshCsrfToken(); return postJSON(url, body, true); }
  if (res.status === 413) return { ok: false, error: '提交内容过大，服务端已拒绝（413）；请拆分后再试' };
  let data; try { data = await res.json(); } catch (e) { return { ok: false, error: `服务端返回异常（HTTP ${res.status}）` }; }
  return data;
}

// ━━━━━ 模态系统（写操作表单共用） ━━━━━
function openModal(title, bodyHTML, onMount, wide) {
  closeModal();
  $('wmodal-title').textContent = title;
  $('wmodal-body').innerHTML = bodyHTML;
  $('wmodal').classList.toggle('wide', !!wide);
  $('wmodal-overlay').hidden = false;
  if (onMount) onMount($('wmodal-body'), closeModal);
  const first = $('wmodal-body').querySelector('input,select');
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { $('wmodal-overlay').hidden = true; $('wmodal-body').innerHTML = ''; }

// ━━━━━ 角色 / 位置 / 雇员下拉（记一笔·搬·未确认三处同步的唯一数据源） ━━━━━
const ADD_RET = '__add_retainer__';
let retainerMax = {};
let retainerSlots = {};
try { retainerSlots = JSON.parse(localStorage.getItem('retainerSlots') || '{}') || {}; } catch (e) {}
function saveRetainerSlots() { try { localStorage.setItem('retainerSlots', JSON.stringify(retainerSlots)); } catch (e) {} }
function currentSlots(cid) { return Math.max(2, Number(retainerMax[cid]) || 0, Number(retainerSlots[cid]) || 0); }
function charOptionsHtml(withSuffix) {
  return S.characters.map(c => `<option value="${c.id}">${escHtml(c.name)}@${escHtml(c.world)}${withSuffix ? `（${escHtml(c.account || '')}）· ${c.kinds || 0} 种` : ''}</option>`).join('');
}
function locationOptionsHtml(cid, extraSlot, withAdd) {
  const slots = Math.min(10, Math.max(2, currentSlots(cid), extraSlot || 0));
  const warehouses = (S.locations || []).filter(l => !/^雇员\d+$/.test(l));
  const wh = (warehouses.length ? warehouses : ['背包', '鞍囊']).map(l => `<option value="${escHtml(l)}">${escHtml(l)}</option>`).join('');
  let ret = '';
  for (let i = 1; i <= slots; i++) ret += `<option value="雇员${i}">雇员${i}</option>`;
  if (withAdd && slots < 10) ret += `<option value="${ADD_RET}">＋ 新增雇员${slots + 1}</option>`;
  return `<optgroup label="角色仓库">${wh}</optgroup><optgroup label="雇员">${ret}</optgroup>`;
}
function learnRetainers(items) {
  (items || []).forEach(it => (it.holders || []).forEach(h => {
    const m = /^雇员(\d+)$/.exec(h.location || '');
    if (m) retainerMax[h.character_id] = Math.max(Number(retainerMax[h.character_id]) || 0, Number(m[1]));
  }));
}

// ━━━━━ 数量解析 / 三格换算（覆盖≠累加语义的基础） ━━━━━
function qtyPerStack(stack) { return stack > 1 ? stack : 999; }
function parseQty(raw, stack) {
  const s = String(raw == null ? '' : raw).trim();
  const m = /^(\d+)\s*组\s*(\d+)?$/.exec(s);
  if (m) { if (stack === 1) return { ok: false, unstackable: true }; return { ok: true, qty: Number(m[1]) * qtyPerStack(stack) + Number(m[2] || 0) }; }
  if (/^\d+$/.test(s)) return { ok: true, qty: Number(s) };
  return { ok: false };
}
function fmtGroup(qty, stack) {
  const per = qtyPerStack(stack);
  if (!(stack > 1) || qty < per) return String(qty);
  const g = Math.floor(qty / per), r = qty % per;
  return g + '组' + (r ? r : '');
}
function syncThree(cfg, source) {
  const per = qtyPerStack(cfg.stack), unstack = cfg.stack === 1;
  const read = el => { const v = el.value.trim(); return /^\d+$/.test(v) ? Number(v) : null; };
  if (source === 'total') {
    const t = read(cfg.total);
    if (t == null || unstack) { cfg.group.value = ''; cfg.rest.value = ''; }
    else { const g = Math.floor(t / per), r = t % per; cfg.group.value = g || ''; cfg.rest.value = r || ''; cfg.restManual = false; }
  } else {
    if (source === 'group' && !cfg.restManual) cfg.rest.value = '';
    if (source === 'rest') cfg.restManual = true;
    const g = read(cfg.group) || 0, r = read(cfg.rest) || 0;
    cfg.total.value = (g || r) ? String(g * per + r) : '';
  }
  const t = read(cfg.total);
  if (cfg.hint) {
    if (unstack) cfg.hint.textContent = t != null ? `不可堆叠，按件数记 · 占 ${t} 格` : '该物品不可堆叠，请直接填件数';
    else if (t != null) { let h = `= ${t} 个 · 占 ${Math.ceil(t / per)} 格`; const r = read(cfg.rest); if (r != null && r >= per) h += '（余数超过一组，建议进位）'; cfg.hint.textContent = h; }
    else cfg.hint.textContent = '';
  }
  return t;
}

// ━━━━━ 覆盖预览索引（来自最近搜索结果，与 V1 同限制） ━━━━━
let qtyIndex = {};
function buildQtyIndex(items) {
  qtyIndex = {};
  (items || []).forEach(it => (it.holders || []).forEach(h => { qtyIndex[`${h.character_id}|${h.location}|${it.name}|${h.hq ? 1 : 0}`] = h.qty; }));
}
function currentQtyForForm(cid, loc, name, hq) { return qtyIndex[`${cid}|${loc}|${name}|${hq ? 1 : 0}`]; }

// ━━━━━ 写后统一刷新（收敛 V1 各操作不一致的刷新序列） ━━━━━
async function refreshAfterWrite() {
  try {
    const st = await api('/api/state');
    S.stock_rows = st.stock_rows || 0; S.total_qty = st.total_qty || 0; S.pending_rows = st.pending_rows || 0; S.character_count = st.character_count || 0;
    if (st.retainer_max) for (const k in st.retainer_max) retainerMax[k] = Math.max(Number(retainerMax[k]) || 0, Number(st.retainer_max[k]));
    $('stat-chars').textContent = S.character_count;
    $('stat-rows').textContent = fmtNum(S.stock_rows); $('stat-qty').textContent = fmtNum(S.total_qty);
    const b = $('btn-pending'); if (S.pending_rows > 0) { b.textContent = `未确认 ${S.pending_rows}`; b.hidden = false; } else b.hidden = true;
  } catch (e) {}
  await search();
}

// ━━━━━ Toast ━━━━━
let toastTimer = null;
function toast(msg, type = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ━━━━━ 初始化 ━━━━━
async function init() {
  try {
    const [st, ch] = await Promise.all([api('/api/state'), api('/api/characters')]);
    S.csrfToken = st.csrf_token || ''; S.version = st.version || ''; S.stale_days = st.stale_days || 7;
    S.locations = st.locations || []; S.characters = ch.characters || [];
    if (st.retainer_max) for (const k in st.retainer_max) retainerMax[k] = Math.max(Number(retainerMax[k]) || 0, Number(st.retainer_max[k]));
    S.character_count = st.character_count || 0; S.stock_rows = st.stock_rows || 0;
    S.total_qty = st.total_qty || 0; S.pending_rows = st.pending_rows || 0;
    $('top-version').textContent = 'v' + S.version;
    $('stat-chars').textContent = S.character_count;
    $('stat-rows').textContent = fmtNum(S.stock_rows);
    $('stat-qty').textContent = fmtNum(S.total_qty);
    if (S.pending_rows > 0) { const b = $('btn-pending'); b.textContent = `未确认 ${S.pending_rows}`; b.hidden = false; }
    populateFilters();
    $('config-overlay').hidden = true;
    await search();
  } catch (e) { showListError(e.message); }
}

function populateFilters() {
  $('f-account').innerHTML = '<option value="">全部账号</option>';
  $('f-character').innerHTML = '<option value="">全部角色</option>';
  $('f-location').innerHTML = '<option value="">全部位置</option>';
  const accounts = [...new Set(S.characters.map(c => c.account).filter(Boolean))];
  accounts.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; $('f-account').append(o); });
  S.characters.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.name}@${c.world}`; $('f-character').append(o); });
  S.locations.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; $('f-location').append(o); });
  $('f-account').value = S.account; $('f-character').value = S.character; $('f-location').value = S.location;
}

// ━━━━━ 搜索 ━━━━━
let searchTimer = null;
function scheduleSearch(delay = 300) { clearTimeout(searchTimer); searchTimer = setTimeout(search, delay); }

async function search() {
  setPhase('loading');
  const p = new URLSearchParams();
  if (S.q) p.set('q', S.q);
  if (S.account) p.set('account', S.account);
  if (S.character) p.set('character', S.character);
  if (S.location) p.set('location', S.location);
  if (S.hq) p.set('hq', S.hq);
  p.set('limit_items', String(S.limit));
  try {
    const d = await api('/api/search?' + p);
    S.items = d.items || []; S.truncated = d.truncated || false;
    buildQtyIndex(S.items); learnRetainers(S.items);
    S.total_items = d.total_items || 0; S.hint = d.hint || '';
    if (d.stats) {
      S.stock_rows = d.stats.stock_rows || S.stock_rows; S.total_qty = d.stats.total_qty || S.total_qty;
      $('stat-rows').textContent = fmtNum(S.stock_rows); $('stat-qty').textContent = fmtNum(S.total_qty);
    }
    setPhase(S.items.length === 0 ? 'empty' : 'ok');
    renderList(); updateResultBar(); updateActiveChips();
    batchLoadIcons(S.items);
  } catch (e) { setPhase('error'); showListError(e.message); }
}

// ━━━━━ 图标批量加载 ━━━━━
async function batchLoadIcons(items) {
  if (!items.length) return;
  const toFetch = [];
  items.forEach(it => {
    const icon = it.icon ? String(it.icon) : '';
    const key = String(it.item_id);   // 统一按 item_id 作键，与 data-icon 一致
    if (icon.startsWith('http') || icon.startsWith('/')) setIconEl(key, icon);
    else toFetch.push(key);
  });
  if (!toFetch.length) return;
  try {
    const d = await api('/api/icons?ids=' + [...new Set(toFetch)].join(','));
    for (const [id, url] of Object.entries(d.icons || {})) setIconEl(id, url);
  } catch (_) {}
}
function setIconEl(iconId, url) {
  document.querySelectorAll(`[data-icon="${iconId}"]`).forEach(img => { img.src = url; img.style.display = 'block'; });
  document.querySelectorAll(`[data-icon-ph="${iconId}"]`).forEach(ph => { ph.hidden = true; });
}

// ━━━━━ 成本栏 + 内联改均价（POST /api/cost，给无批次旧库存设基线单价） ━━━━━
function fmtAvg(v) { const n = Number(v) || 0; return n % 1 ? n.toFixed(1) : String(n); }
function buildCostNote(it) {
  const avg = Number(it.avg_cost) || 0, spent = Number(it.spent) || 0, count = Number(it.purchase_count) || 0;
  if (count > 0) return `<span class="cost-note" data-batch="1" data-batch-name="${escHtml(it.name)}" data-batch-hq="${it.hq ? 1 : 0}" title="点击查看/删除采购批次">均 <b>${fmtAvg(avg)}</b> gil · ${count} 批 · 估值 ${fmtNum(spent)} ▾</span>`;
  const attrs = `data-cost-edit="1" data-cost-name="${escHtml(it.name)}" data-cost-hq="${it.hq ? 1 : 0}" data-cost-avg="${avg}"`;
  if (!avg) return `<span class="cost-note empty" ${attrs}>设成本 ⊕</span>`;
  return `<span class="cost-note" ${attrs}>均 <b>${fmtAvg(avg)}</b> gil · 估值 ${fmtNum(spent)} ✎</span>`;
}
function startCostEdit(el) {
  const name = el.dataset.costName || '', hq = Number(el.dataset.costHq) || 0, cur = Number(el.dataset.costAvg) || 0;
  const prevHTML = el.innerHTML;
  el.innerHTML = `<span class="cost-edit"><input class="inline-cost" type="text" inputmode="numeric" value="${cur || ''}" aria-label="单价"> gil</span>`;
  const input = el.querySelector('input');
  input.focus(); input.select();
  let busy = false, done = false;
  const restore = () => { if (done) return; done = true; el.innerHTML = prevHTML; };
  const commit = async () => {
    if (busy) return;
    const price = Number(String(input.value).replace(/[,，\s]/g, ''));
    if (!isFinite(price) || price < 0) { toast('单价填得不对', 'warn'); input.focus(); return; }
    if (Math.round(price) === cur) { restore(); return; }
    busy = true; input.disabled = true;
    const res = await postJSON('/api/cost', { item_name: name, hq, unit_price: Math.round(price) });
    busy = false;
    if (!res.ok) { toast(res.error || '保存失败', 'warn'); input.disabled = false; input.focus(); return; }
    toast(`已设成本：${name} 均 ${Math.round(price).toLocaleString('en-US')} gil`);
    done = true;
    refreshAfterWrite();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') { e.preventDefault(); restore(); } });
  input.addEventListener('blur', () => { if (!busy) restore(); });
}

// ━━━━━ 采购批次管理（查看 / 删批次；改价＝删基线＋重设成本） ━━━━━
async function openBatches(name, hq) {
  let data;
  try { data = await api('/api/purchase?item_name=' + encodeURIComponent(name) + '&hq=' + hq); }
  catch (e) { toast('批次读取失败：' + e.message, 'warn'); return; }
  const rows = data.rows || [];
  const body = rows.length ? rows.map(r => `
    <div class="wrow" style="align-items:center;border-bottom:1px solid var(--line);padding:6px 0">
      <div style="flex:1;min-width:0;font-size:12px">${r.location === '基线' ? '<span class="kind-tag">基线</span> ' : ''}${fmtNum(r.qty)} 个 × ${fmtNum(r.unit_price)} gil<div class="hintline">${escHtml(r.date_text || '')}${r.location && r.location !== '基线' ? ' · ' + escHtml(r.location) : ''} · 小计 ${fmtNum(r.cost)} gil</div></div>
      <button class="btn-mini danger" data-del-batch="${r.id}">删</button>
    </div>`).join('') : '<div class="hintline">没有采购批次。</div>';
  openModal(`采购批次 · ${name}${hq ? '（HQ）' : ''}`, `
    <div class="wform">
      <div class="hintline">共 ${data.count} 批 · 加权均价 ${fmtAvg(data.avg_cost)} gil · 总估值 ${fmtNum(data.total_cost)} gil</div>
      ${body}
      <div class="hintline">删掉「基线」批次后可重新设成本；删除真实采购批次会改变加权均价。</div>
      <div class="wactions"><button class="btn-ghost" id="batch-close">关闭</button></div>
    </div>`, (b, close) => {
    $('batch-close').addEventListener('click', close);
    b.querySelectorAll('[data-del-batch]').forEach(btn => btn.addEventListener('click', async () => {
      if (btn.dataset.armed === '1') {
        btn.disabled = true;
        const res = await postJSON('/api/purchase/delete', { id: Number(btn.dataset.delBatch) });
        btn.disabled = false;
        if (!res.ok) { toast(res.error || '删除失败', 'warn'); btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = '删'; return; }
        toast('已删除批次');
        refreshAfterWrite(); openBatches(name, hq);
      } else {
        btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = '确认';
        toast('再点一次确认删除该批次（3 秒内）', 'warn');
        setTimeout(() => { if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = '删'; } }, 3000);
      }
    }));
  }, true);
}

// ━━━━━ 渲染列表 ━━━━━
function setPhase(phase) { S.phase = phase; }
function renderList() {
  const el = $('item-list');
  if (S.phase === 'loading') { el.innerHTML = skeletonHTML(8); return; }
  if (S.phase === 'error') return;
  if (S.phase === 'empty') { el.innerHTML = emptyHTML(); return; }
  el.innerHTML = '';
  const frag = document.createDocumentFragment();
  S.items.forEach(it => frag.append(buildItemCard(it)));
  if (S.truncated) {
    const w = document.createElement('div'); w.className = 'truncated-hint';
    w.innerHTML = `仅显示前 ${S.items.length} 种，共 ${fmtNum(S.total_items)} 种。<a id="btn-load-more">加载全部（最多 200）</a>`;

function buildItemCard(it) {
  const hasStale = it.holders && it.holders.some(h => h.stale);

  const cardId = `${it.item_id}-${it.hq ? 'hq' : 'nq'}`;
  const isSelected = cardId === S.selectedItemId;
  const expanded = document.querySelector(`.item-card[data-id="${cardId}"]`)?.classList.contains('expanded');
  const holderCount = it.holders ? it.holders.length : 0; const iconId = it.item_id;
  const card = document.createElement('div');
  card.className = `item-card${isSelected ? ' selected' : ''}${stackWarn ? ' warn-stack' : ''}${expanded ? ' expanded' : ''}`;
  card.dataset.id = cardId;
  const hqBadge = it.hq ? `<span class="badge-hq">HQ</span>` : '';
  const alias = it.aliases && it.aliases.length ? `<div class="item-alias">${escHtml(it.aliases.slice(0,2).join(' · '))}</div>` : '';
  const staleDot = hasStale ? `<span class="stale-indicator" title="有持有者数据较旧"></span>` : '';
  const qtyClass = hasStale ? 'item-qty stale' : 'item-qty';
  card.innerHTML = `<div class="item-main" data-action="select" data-id="${cardId}">
    <div class="item-icon-wrap">

// ━━━━━ 详情面板 ━━━━━
function selectItem(cardId) {
  S.selectedItemId = cardId;
  document.querySelectorAll('.item-card').forEach(c => c.classList.toggle('selected', c.dataset.id === cardId));
  const it = S.items.find(i => `${i.item_id}-${i.hq ? 'hq' : 'nq'}` === cardId);

  batchLoadIcons([it]);
}

function openDrawer() { $('drawer-mask').hidden = false; $('detail-drawer').classList.add('open'); }
function closeDrawer() { $('detail-drawer').classList.remove('open'); $('drawer-mask').hidden = true; }

// ━━━━━ 事件委托 ━━━━━
document.addEventListener('click', e => {
  const costEl = e.target.closest('[data-cost-edit]');
  if (costEl) { if (!costEl.querySelector('input')) startCostEdit(costEl); return; }
  const batchEl = e.target.closest('[data-batch]');
  if (batchEl) { openBatches(batchEl.dataset.batchName, Number(batchEl.dataset.batchHq)); return; }
  const btn = e.target.closest('[data-action]');
  if (!btn) {
    const clearBtn = e.target.closest('[data-clear]');
    if (clearBtn) {
      const key = clearBtn.dataset.clear; S[key] = '';
      const selMap = { account: 'f-account', character: 'f-character', location: 'f-location', hq: 'f-hq' };
      if (selMap[key]) $(selMap[key]).value = '';
      if (key === 'q') $('q-input').value = '';
      scheduleSearch(0);
    }
    return;
  }
  const action = btn.dataset.action;
  if (action === 'select') { selectItem(btn.dataset.id); return; }
  if (action === 'expand') {
    e.stopPropagation(); const id = btn.dataset.id;
    const card = document.querySelector(`.item-card[data-id="${id}"]`);
    if (!card) return;
    const isExpanded = card.classList.toggle('expanded');
    card.querySelector('.holder-list').hidden = !isExpanded;
    return;
  }
  if (action === 'record') { const it = S.items.find(i => `${i.item_id}-${i.hq ? 'hq' : 'nq'}` === S.selectedItemId); openRecord(it ? { item_name: it.name, stack: it.stack } : null); return; }
  if (action === 'edit') { openEdit(btn); return; }
  if (action === 'move') { openMove(btn); return; }
  if (action === 'take') { openTake(btn); return; }
  if (action === 'del') { deleteRow(btn); return; }
  if (action === 'set-safety') {
    const form = $('detail-safety-form');
    form.hidden = !form.hidden;
    if (!form.hidden) $('detail-safety-qty').focus();
    return;
  }
});

$('btn-export').addEventListener('click', async () => {
  try {

function recEls() {
  return { char: $('rec-character'), item: $('rec-item'), loc: $('rec-location'), total: $('rec-total'), group: $('rec-group'), rest: $('rec-rest'), price: $('rec-price'), hq: $('rec-hq'), hint: $('rec-hint'), qtyHint: $('rec-qty-hint'), cost: $('rec-cost') };

function readPriceInput() { const v = Number(String($('rec-price').value).replace(/[,，\s]/g, '')); return isFinite(v) && v > 0 ? Math.round(v) : 0; }

  const e = recEls(); if (!e.char || !e.hint) return;

function updateCostPreview() {

async function saveStock(forcePayload) {
  const e = recEls(); if (!e.char) return;
  if (!e.char.value) { toast('先添加一个角色', 'warn'); return; }
  const name = e.item.value.trim();
  if (!name) { toast('填材料名', 'warn'); e.item.focus(); return; }
  const t = parseQty(e.total.value, recStack);
  if (!t.ok) { toast('数量填得不对，支持 1523 或 1组524 两种写法', 'warn'); e.total.focus(); return; }
  const payload = forcePayload || { character_id: Number(e.char.value), item_name: name, location: e.loc.value || '背包', qty: t.qty, hq: e.hq.checked ? 1 : 0, unit_price: readPriceInput(), mode: recMode };
  const btn = $('rec-save'); if (btn) btn.disabled = true;
  const res = await postJSON('/api/stock', payload);
  if (btn) btn.disabled = false;
  if (!res.ok && res.hint === 'pick') { pendingSave = payload; openPicker(name); toast(`库里没有「${name}」这个名字，可能打错了。选一个绑定，或点「先按原名临时记录」`, 'warn'); return; }
  if (!res.ok) { showRecError('保存失败：' + (res.error || '未知错误')); return; }
  if (res.unchanged) { toast(`数量和原来一样（${fmtGroup(res.qty, recStack)}），未产生改动`); return; }
  const isAdd = res.mode === 'add' || res.action === 'add' || recMode === 'add';
  const amount = isAdd && res.added != null ? res.added : res.qty;
  let msg = (isAdd ? '已加：' : '已记：') + res.item_name + ' ' + amount;
  if (res.renamed) msg = `已按标准名「${res.item_name}」${isAdd ? '加了' : '记录'} ${amount}（你输入的是「${res.input_name}」）`;
  if (res.unbound) msg += ' · 临时记录（未绑定物品）';
  if (res.cost) msg += ` · 成本 ${res.cost} gil`;
  msg += ` → ${res.character} / ${res.location}（合计 ${res.total}）`;
  toast(msg);
  e.item.value = ''; e.hq.checked = false; e.total.value = ''; e.group.value = ''; e.rest.value = ''; e.price.value = '';
  recStack = 0; e.hint.textContent = ''; e.qtyHint.textContent = ''; updateCostPreview(); e.item.focus();
  refreshAfterWrite();
}

// ━━━━━ 绑定 picker（认不出名字时） ━━━━━
let pickerSeq = 0, pickAlias = '';
function openPicker(alias) {

  $('picker-q').value = alias;
  $('picker-overlay').hidden = false;

}
function closePicker() { $('picker-overlay').hidden = true; pendingSave = null; }
function pickerRow(id, name) { return `<div class="picker-row" data-bind="${id}" data-name="${escHtml(name)}"><span>${escHtml(name)}</span><span style="color:var(--muted);font-size:11px">#${id}</span><span class="bind">点我绑定</span></div>`; }
async function pickerSearch(q) {
  const seq = ++pickerSeq, box = $('picker-results');
  box.innerHTML = '<div class="hintline">搜索中…</div>';
  try {
    const d = await api('/api/item_search?q=' + encodeURIComponent(q));
    if (seq !== pickerSeq) return;
    let html = (d.items || []).map(it => pickerRow(it.id, it.name)).join('');
    if (/[a-zA-Z]/.test(q)) { try { const en = await api('/api/item_search_en?q=' + encodeURIComponent(q)); if (seq === pickerSeq && en.items && en.items.length) html += '<div class="picker-sec">英文名匹配（XIVAPI）</div>' + en.items.map(it => pickerRow(it.id || it.item_id, it.name)).join(''); } catch (e) {} }
    if (/^#?\d+$/.test(q.trim())) { try { const by = await api('/api/item_by_id?id=' + q.trim().replace('#', '')); if (seq === pickerSeq && by.item_id) html += '<div class="picker-sec">按 ID</div>' + pickerRow(by.item_id, by.name || by.name_en || ('#' + by.item_id)); } catch (e) {} }
    if (seq !== pickerSeq) return;
    box.innerHTML = html || '<div class="hintline">本地表里没有相近的名字。可以试试英文名（例如 Iron Ingot），或者输入物品 ID。</div>';
    box.querySelectorAll('[data-bind]').forEach(r => r.addEventListener('click', () => doBind(Number(r.dataset.bind), r.dataset.name)));
  } catch (e) { if (seq === pickerSeq) box.innerHTML = '<div class="hintline bad">搜索失败：' + escHtml(e.message) + '</div>'; }
}
async function doBind(itemId, itemName) {
  const res = await postJSON('/api/alias', { alias: pickAlias, item_id: itemId });
  if (!res.ok) { toast(res.error || '绑定失败', 'warn'); return; }
  toast(`已绑定：${pickAlias} → ${itemName} #${itemId}`);
  $('picker-overlay').hidden = true;

}

// ━━━━━ 批量粘贴 / CSV 导入 ━━━━━
function parseBatchLine(line) {
  const raw = line.trim();
  if (!raw || raw.startsWith('#')) return null;
  const parts = raw.split(/\s+/);
  let hq = 0;
  if (parts.length > 1 && /^(hq|hq1|高质量)$/i.test(parts[parts.length - 1])) { hq = 1; parts.pop(); }
  let location = '';
  if (parts.length > 2 && (S.locations || []).includes(parts[parts.length - 1])) location = parts.pop();
  if (parts.length < 2) return null;
  const t = parseQty(parts.pop(), 0);
  if (!t.ok || t.qty <= 0) return null;
  const name = parts.join(' ');
  return name ? { name, qty: t.qty, location, hq } : null;
}
function batchPreview() {
  const el = $('bt-preview'); if (!el) return;
  const lines = $('bt-text').value.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
  if (!lines.length) { el.textContent = ''; el.className = 'hintline'; return; }
  const cid = $('bt-char').value, loc = $('bt-loc').value, add = $('bt-add').checked;
  let ok = 0, bad = 0, newCnt = 0, overCnt = 0, dup = 0; const keys = {};
  lines.forEach(line => {
    const p = parseBatchLine(line);
    if (!p) { bad++; return; }
    ok++;
    const l = p.location || loc, key = `${cid}|${l}|${p.name}|${p.hq}`;
    if (keys[key]) dup++; keys[key] = 1;
    const cur = currentQtyForForm(cid, l, p.name, p.hq);
    if (add || cur == null) newCnt++; else overCnt++;
  });
  let msg = `将写入 ${ok} 行 · 新增 ${newCnt} · 覆盖 ${overCnt}` + (bad ? ` · 无法识别 ${bad}` : '');
  if (dup) msg += ` ⚠ 有 ${dup} 行重复（同名+同位置+同品质），只保留最后一行`;
  el.textContent = msg + '（基于当前搜索结果估算）'; el.className = 'hintline' + ((bad || dup) ? ' warn' : '');
}
function openBatch() {
  if (!S.characters.length) { toast('先添加一个角色', 'warn'); openAddCharacter(); return; }
  let lastChar = null; try { lastChar = localStorage.getItem('recChar'); } catch (e) {}
  const cid0 = S.characters.some(c => String(c.id) === lastChar) ? lastChar : S.characters[0].id;
  openModal('批量录入', `
    <div class="wform">
      <div class="picker-sec">批量粘贴</div>
      <div class="wrow"><div class="wfield"><label>角色</label><select id="bt-char">${charOptionsHtml(false)}</select></div><div class="wfield"><label>位置</label><select id="bt-loc"></select></div></div>
      <label class="wcheck"><input type="checkbox" id="bt-add"> 按增量累加（不勾是覆盖同格数量）</label>
      <div class="wfield"><textarea id="bt-text" rows="6" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:13px;background:var(--panel);color:var(--text);resize:vertical" placeholder="一行一条：材料名 数量 [位置] [hq]&#10;例如：黑铁锭 100&#10;铁矿 50 背包 hq&#10;# 开头是注释"></textarea><div class="hintline" id="bt-preview"></div></div>
      <div class="wactions"><button class="btn-primary" id="bt-run">开始导入</button></div>
      <div id="bt-result"></div>
      <div class="picker-sec" style="margin-top:16px">CSV 导入</div>
      <div class="wfield"><label>选择 CSV 文件（上限 2MB）</label><input type="file" id="bt-file" accept=".csv,text/csv"></div>
    </div>`, (body) => {
    const charSel = $('bt-char'), locSel = $('bt-loc');
    charSel.value = cid0;
    const rebuildLoc = () => { locSel.innerHTML = locationOptionsHtml(charSel.value, 0, false); locSel.value = '背包'; };
    rebuildLoc();
    charSel.addEventListener('change', () => { rebuildLoc(); batchPreview(); });
    locSel.addEventListener('change', batchPreview);
    $('bt-add').addEventListener('change', batchPreview);
    $('bt-text').addEventListener('input', batchPreview);
    $('bt-run').addEventListener('click', runBatch);
    $('bt-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) previewImport(f); });
    batchPreview();
  }, true);
}
async function runBatch() {
  const cid = $('bt-char').value;
  if (!cid) { toast('先选一个角色', 'warn'); return; }
  const text = $('bt-text').value;
  if (!text.trim()) { toast('粘贴内容为空', 'warn'); return; }
  const btn = $('bt-run'); btn.disabled = true; btn.textContent = '导入中…';
  const res = await postJSON('/api/stock/batch', { character_id: Number(cid), text, location: $('bt-loc').value || '背包', mode: $('bt-add').checked ? 'add' : 'set' });
  btn.disabled = false; btn.textContent = '开始导入';
  if (!res.ok) { toast(res.error || '导入失败', 'warn'); return; }
  const rows = (res.results || []).map(r => `<div class="hintline${r.ok ? '' : ' bad'}">${r.ok ? (r.unchanged ? '○' : '✅') : '❌'} ${escHtml(r.line)} — ${escHtml(r.message || '')}</div>`).join('');
  $('bt-result').innerHTML = `<div class="hintline">成功 ${res.added} 条 · 未变 ${res.unchanged} 条 · 失败 ${res.failed} 条</div>` + rows;
  toast(`导入完成：成功 ${res.added} 条`);
  refreshAfterWrite();
}
const MAX_IMPORT_BYTES = 2 * 1024 * 1024;
let importText = '';
async function previewImport(file) {
  if (file.size > MAX_IMPORT_BYTES) { toast(`文件太大（${Math.round(file.size / 1024)} KB），导入上限 2 MB，请拆分后再试`, 'warn'); return; }
  importText = await file.text();
  const res = await postJSON('/api/stock/import/preview', { text: importText });
  if (!res.ok) { toast(res.error || '预览失败', 'warn'); return; }
  showImportPreview(file.name, res);
}
function showImportPreview(fname, res) {
  const ambiguous = res.ambiguous || [];
  const skippedRows = res.skipped || [];
  const ambHtml = ambiguous.length ? `<div class="form-error" style="margin:8px 0"><span class="msg">同名同服多个账号，无法确定身份；请在 CSV 补 account 列后重新选择文件${ambiguous.length > 8 ? '（仅列前 8 条）' : ''}</span></div>` + ambiguous.slice(0, 8).map(a => `<div class="hintline bad">第 ${a.line} 行 ${escHtml(a.character)}：${(a.candidates || []).map(c => `${escHtml(c.account)}（现有 ${c.qty}）`).join(' / ')}</div>`).join('') : '';
  const skipHtml = skippedRows.length ? `<div class="picker-sec">跳过明细</div>` + skippedRows.slice(0, 6).map(s => `<div class="hintline">第 ${s.line} 行 ${escHtml(s.name || '')}：${escHtml(s.reason || '')}</div>`).join('') + (skippedRows.length > 6 ? `<div class="hintline">…等 ${skippedRows.length} 条</div>` : '') : '';
  openModal('CSV 导入预览', `
    <div class="wform">
      <div class="hintline">${escHtml(fname)} · 共 ${res.total} 行 · 新增 ${res.will_add} 条 · 覆盖 ${res.will_update} 条 · 跳过 ${skippedRows.length} 条</div>
      ${res.new_characters && res.new_characters.length ? `<div class="hintline">将新建角色：${res.new_characters.map(escHtml).join('、')}</div>` : ''}
      ${ambHtml}${skipHtml}
      <div class="wactions"><button class="btn-ghost" id="imp-cancel">取消</button><button class="btn-ghost" id="imp-append" ${ambiguous.length ? 'disabled' : ''}>追加导入</button><button class="btn-primary" id="imp-overwrite" ${ambiguous.length ? 'disabled' : ''}>覆盖导入</button></div>
    </div>`, (body, close) => {
    $('imp-cancel').addEventListener('click', close);
    $('imp-append').addEventListener('click', () => runImport('append'));
    $('imp-overwrite').addEventListener('click', () => runImport('overwrite'));
  }, true);
}
async function runImport(mode) {
  closeModal(); toast('导入中…');
  const res = await postJSON('/api/stock/import/apply', { text: importText, mode });
  if (!res.ok) {
    if (res.ambiguous) { showImportPreview('CSV', { total: 0, will_add: 0, will_update: 0, skipped: [], ambiguous: res.ambiguous }); toast('导入已中止，未写入任何行。', 'warn'); }
    else toast(res.error || '导入失败', 'warn');
    return;
  }
  toast(`导入完成：新增 ${res.added}，覆盖 ${res.updated}` + (res.created_characters ? ` · 新建角色 ${res.created_characters}` : ''));
  refreshAfterWrite();
}

// ━━━━━ 模态 / picker 关闭绑定 ━━━━━
$('wmodal-close').addEventListener('click', closeModal);
$('wmodal-overlay').addEventListener('click', e => { if (e.target === $('wmodal-overlay')) closeModal(); });
$('picker-close').addEventListener('click', closePicker);
$('picker-cancel').addEventListener('click', closePicker);
$('picker-overlay').addEventListener('click', e => { if (e.target === $('picker-overlay')) closePicker(); });
$('picker-force').addEventListener('click', () => { const snap = pendingSave; $('picker-overlay').hidden = true; pendingSave = null; if (snap) saveStock({ ...snap, allow_unbound: 1 }); });
let pickerTimer = null;
$('picker-q').addEventListener('input', () => { clearTimeout(pickerTimer); const q = $('picker-q').value.trim(); if (q) pickerTimer = setTimeout(() => pickerSearch(q), 150); });
$('picker-q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const q = $('picker-q').value.trim(); if (q) pickerSearch(q); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('picker-overlay').hidden) closePicker();
  else if (!$('wmodal-overlay').hidden) closeModal();
});

// ━━━━━ 启动 ━━━━━
$('config-url').value = CFG.baseUrl || location.origin;
init();

/* ━━━━━ 页面心跳（内联）：开着就每 3 秒 ping，保活后端 ━━━━━ */
(function () {
  const sid = "p" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  let timer = null;
  function ping() {
    try {
      fetch("/api/page/ping", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sid, visible: document.visibilityState === "visible" }), keepalive: true }).catch(() => {});
    } catch (e) {}
  }
  function start() { if (timer) return; ping(); timer = setInterval(ping, 3000); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") ping(); });
  window.addEventListener("pageshow", start);
  window.addEventListener("pagehide", stop);
  start();
})();

/* ━━━━━ 页面切换快捷键（内联，可自录；与算料页双向互通） ━━━━━ */
(function () {
  const STORE = "ff14_page_hotkeys_v1";
  const DEFAULTS = { stock: "alt+1", calc: "alt+2" };
  const PAGES = { stock: "/ff14-stock-v2.html", calc: "/recipe-planner.html" };
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE) || "{}");
      return { stock: typeof raw.stock === "string" ? raw.stock : DEFAULTS.stock, calc: typeof raw.calc === "string" ? raw.calc : DEFAULTS.calc };
    } catch (e) { return { ...DEFAULTS }; }
  }
  let cfg = load(), recording = null;
  function save() { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} }
  function comboOf(e) {
    if (!(e.ctrlKey || e.altKey || e.metaKey)) return "";
    const mods = [];
    if (e.ctrlKey) mods.push("ctrl"); if (e.altKey) mods.push("alt"); if (e.metaKey) mods.push("meta"); if (e.shiftKey) mods.push("shift");
    let key = ""; const code = e.code || "";
    if (code.startsWith("Key")) key = code.slice(3).toLowerCase();
    else if (code.startsWith("Digit")) key = code.slice(5);
    else if (code === "Space") key = "space";
    else if (/^F\d+$/.test(code)) key = code.toLowerCase();
    else if (e.key && e.key.length === 1) key = e.key.toLowerCase();
    if (!key) return "";
    mods.sort();
    return mods.join("+") + "+" + key;
  }
  function label(combo) {
    if (!combo) return "未设置";
    const map = { ctrl: "Ctrl", alt: "Alt", meta: "Meta", shift: "Shift", space: "Space" };
    return combo.split("+").map(p => map[p] || (p.length === 1 ? p.toUpperCase() : p)).join("+");
  }
  function go(page) {
    const url = PAGES[page];
    if (!url) return;
    if (page === "stock" && location.pathname.endsWith("ff14-stock-v2.html")) return;
    if (page === "calc" && location.pathname.endsWith("recipe-planner.html")) return;
    location.href = url;
  }
  document.addEventListener("keydown", e => {
    if (recording) {
      e.preventDefault(); e.stopPropagation();
      if (e.key === "Escape") { recording = null; refresh(); return; }
      const combo = comboOf(e);
      if (!combo) { recording = null; refresh(); return; }
      cfg[recording] = combo; save(); recording = null; refresh(); return;
    }
    const combo = comboOf(e);
    if (!combo) return;
    if (combo === cfg.stock) { e.preventDefault(); go("stock"); }
    else if (combo === cfg.calc) { e.preventDefault(); go("calc"); }
  }, true);
  let panel = null, btn = null;
  function refresh() {
    if (!panel) return;
    Object.keys(cfg).forEach(key => {
      const el = panel.querySelector('[data-combo="' + key + '"]');
      if (!el) return;
      el.textContent = recording === key ? "按下组合键…" : label(cfg[key]);
      el.classList.toggle("recording", recording === key);
    });
    if (btn) btn.title = "自定义快捷键（库存 " + label(cfg.stock) + " / 算料 " + label(cfg.calc) + "）";
  }
  function placePanel() {
    if (!btn || !panel) return;
    const r = btn.getBoundingClientRect();
    panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 368)) + "px";
    panel.style.top = (r.bottom + 6) + "px";
  }
  function mount() {
    const nav = document.querySelector(".topbar-actions");
    if (!nav || document.querySelector(".hk-open")) return;
    btn = document.createElement("button");
    btn.type = "button"; btn.className = "hk-open"; btn.textContent = "⌨"; btn.setAttribute("aria-label", "自定义快捷键");
    nav.insertBefore(btn, nav.firstChild);
    panel = document.createElement("div");
    panel.className = "hk-panel"; panel.hidden = true;
    panel.innerHTML =
      '<div class="hk-title">+ 快捷键（可自己录）</div>' +
      '<div class="hk-row"><span class="hk-name">库存</span><button type="button" class="hk-combo" data-combo="stock"></button><button type="button" class="hk-record" data-record="stock">录制</button></div>' +
      '<div class="hk-row"><span class="hk-name">算料清单</span><button type="button" class="hk-combo" data-combo="calc"></button><button type="button" class="hk-record" data-record="calc">录制</button></div>' +
      '<div class="hk-tip">录制时按下组合键即可（必须带 Ctrl / Alt / Meta），Esc 取消录制。</div>' +
      '<div class="hk-actions"><button type="button" data-reset>恢复默认</button></div>';
    const header = nav.closest("header") || nav.parentNode;
    header.parentNode.insertBefore(panel, header.nextSibling);
    btn.addEventListener("click", () => { panel.hidden = !panel.hidden; if (!panel.hidden) { refresh(); placePanel(); } else { recording = null; refresh(); } });
    panel.querySelectorAll("[data-record]").forEach(el => el.addEventListener("click", () => { recording = el.dataset.record; refresh(); }));
    panel.querySelector("[data-reset]").addEventListener("click", () => { cfg = { ...DEFAULTS }; recording = null; save(); refresh(); });
    document.addEventListener("click", e => { if (panel.hidden) return; if (panel.contains(e.target) || btn.contains(e.target)) return; panel.hidden = true; recording = null; refresh(); });
    window.addEventListener("resize", () => { if (!panel.hidden) placePanel(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden && !recording) panel.hidden = true; });
    refresh();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();
</script>
