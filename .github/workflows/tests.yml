name: backend-tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare test item data
        shell: pwsh
        env:
          FF14_STOCK_DATA: ${{ runner.temp }}\ff14-test
        # 测试自己也会建隔离目录；两处都放一份，避免以后测试设施改动后缺物品表。
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          New-Item -ItemType Directory -Force -Path $env:FF14_STOCK_DATA | Out-Null
          Copy-Item "tools/tests/fixtures/items.json" "data/items.json"
          Copy-Item "tools/tests/fixtures/items.json" (Join-Path $env:FF14_STOCK_DATA "items.json")

      - name: Run backend tests
        env:
          FF14_STOCK_DATA: ${{ runner.temp }}\ff14-test
        run: python -B -m unittest tools.tests.test_core
